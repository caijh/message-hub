# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
futures = "0.1.17"
actix-web = "4.4.0"
chrono = "0.4"
rust-crypto = "^0.2"
rkv = "0.10"
config = "0.9"
clap = "~2.33"
reqwest = "0.9.16"
quick-xml = "0.12.0"
uuid = { version = "0.7", features = ["v4"] }
sha1_smol = "1.0.0"
base64 = "0.21.4"
aes = "0.7.5"
block-modes = "0.8.1"
actix-files = "0.6.2"
handlebars = { version = "4.4.0", features = ["dir_source"] }
rbs = "4.4.0"
rbatis = "4.4.1"
rbdc-mysql = "4.4.0"
state = "0.6.0"
serde = "1.0.188"
serde_derive = "1.0.188"
serde_json = "1.0.107"
env_logger = "0.10.0"
