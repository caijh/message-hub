[package]
name = "message-hub"
version = "0.1.1"
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
util = { git = "https://caijh@bitbucket.org/bytebinary/util_rs.git" }
logger = { git = "https://caijh@bitbucket.org/bytebinary/logger_rs.git" }
configuration = { git = "https://caijh@bitbucket.org/bytebinary/configuration_rs.git" }
registration = { git = "https://caijh@bitbucket.org/bytebinary/registration_rs.git" }
database = { git = "https://caijh@bitbucket.org/bytebinary/database_rs.git" }
redis_util = { git = "https://caijh@bitbucket.org/bytebinary/redis-util-rs.git" }
futures = "0.3.29"
actix-web = "4.4.0"
chrono = "0.4"
rust-crypto = "^0.2"
rkv = "0.19.0"
config = "0.13.4"
clap = { version = "4.4.10", features = ["derive", "cargo"] }
reqwest = { version = "0.11.22", features = ["json"] }
quick-xml = "0.31.0"
uuid = { version = "1.6.1", features = ["v4"] }
sha1_smol = "1.0.0"
base64 = "0.21.5"
aes = "0.8.3"
actix-files = "0.6.2"
handlebars = { version = "4.5.0", features = ["dir_source"] }
rbs = "4.5.2"
rbatis = "4.5.6"
rbdc-mysql = "4.5.1"
state = "0.6.0"
serde = "1.0.193"
serde_derive = "1.0.193"
serde_json = "1.0.108"
env_logger = "0.10.1"
lazy_static = "1.4.0"
url = "2.5.0"
parking_lot = "0.12.1"
tracing = "0.1.40"
cbc = { version = "0.1.2", features = ["alloc"] }
redis = "0.23.3"
