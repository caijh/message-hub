[package]
name = "message-hub"
version = "0.1.1"
edition = "2021"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
util = { git = "https://caijh@bitbucket.org/bytebinary/util-rs.git" }
logger = { git = "https://caijh@bitbucket.org/bytebinary/logger-rs.git" }
configuration = { git = "https://caijh@bitbucket.org/bytebinary/configuration-rs.git" }
registration = { git = "https://caijh@bitbucket.org/bytebinary/registration-rs.git" }
database = { git = "https://caijh@bitbucket.org/bytebinary/database-rs.git" }
redis_util = { git = "https://caijh@bitbucket.org/bytebinary/redis-util-rs.git" }
# context
context = {git = "https://caijh@bitbucket.org/bytebinary/context-rs.git"}

futures = "0.3.30"
actix-web = "4.5.1"
chrono = "0.4"
rust-crypto = "^0.2"
rkv = "0.19.0"
config = "0.14.0"
clap = { version = "4.5.4", features = ["derive", "cargo"] }
reqwest = { version = "0.11.27", features = ["json"] }
quick-xml = "0.31.0"
uuid = { version = "1.8.0", features = ["v4"] }
sha1_smol = "1.0.0"
base64 = "0.21.7"
aes = "0.8.4"
actix-files = "0.6.5"
handlebars = { version = "5.1.2", features = ["dir_source"] }
rbs = "4.5.13"
rbatis = "4.5.21"
rbdc-mysql = "4.5.7"
state = "0.6.0"
serde = "1.0.197"
serde_derive = "1.0.197"
serde_json = "1.0.115"
env_logger = "0.11.3"
lazy_static = "1.4.0"
url = "2.5.0"
parking_lot = "0.12.1"
tracing = "0.1.40"
cbc = { version = "0.1.2", features = ["alloc"] }
redis = "0.24.0"
